query=select gl.gl_head, ap.gl_subhead, ap.product_type,ap.product_code,p.category, ap.branch_code,br.branch_name,ap.currency_code,sum(ab.balance_magnitude) \
from account_balances ab, account_profiles ap, gl_subheads gl,branches br,products p \
where ab.account_id = ap.account_id and ap.gl_subhead = gl.gl_subhead and ap.tenant_code = gl.tenant_code \
and ap.currency_code=p.currency_code and ap.product_code=p.product_code and \
ap.product_type=p.product_type and ab.tenant_code = ap.tenant_code and ap.tenant_code=p.tenant_code and \
ab.tenant_code = :tenant_code and ap.branch_code in (select b.branch_code from branchset_branches b \
where b.branchset_code = :branchset_code_select and b.tenant_code = :tenant_code) and \
br.branch_code = ap.branch_code and br.tenant_code = ap.tenant_code \
group by gl.gl_head,ap.tenant_code,ap.gl_subhead,ap.product_type,ap.product_code,ap.currency_code,ap.branch_code order by gl.gl_head
header=GL Head,GL Subhead,Product Type,Product Code,Code,Branch Code,Branch Name,Currency,Amount
params=tenant_code,branchset_code_select
label.tenant_code=Tenant Code
default.tenant_code=
label.branchset_code_select=Branchset
default.branchset_code_select=All

query=Select p.account_id as string_value from account_profiles p, loan_od_working_registers w, branchset_branches bsb where p.tenant_code = :tenant_code and bsb.branchset_code = :branchset_code_select and p.tenant_code = w.tenant_code and p.account_id = w.account_id and p.product_type = 'Loans' and p.operational_status <> 3 and w.num_disbursements > 0 and w.num_demands + w.num_repayments > 0 and bsb.branch_code = p.branch_code and bsb.tenant_code = p.tenant_code and ( ( p.opened_on_value_date >= :from_date and p.opened_on_value_date <= :to_date) or (p.opened_on_value_date < :from_date and ( p.closed_on_value_date is null or p.closed_on_value_date >= :from_date ) ) )
header=Account Number,URN No,Branch Code,Product Code,Repayment Date,Transaction Date,Transaction Id,Amount,Principal,Normal Interest,Penal Interest,Forfeiture / Waiver,Demand Number,Demand Date,Demand Amount,Repayment Number,Repayment Amount,Demand Due,Repayment Type,Status,Interest TDS,Old Dpd,Dpd,User,Instrument,Customer Name,Created At,Tag,Interest Rate,Branch Name,Account Code,Vertical,Guarantor Name,Remarks,Days to satisfy,EffectiveDpd
params=tenant_code,branchset_code_select,from_date,to_date
label.tenant_code=Tenant Code
default.tenant_code=
label.branchset_code_select=Branchset
default.branchset_code_select=All
label.from_date=From Date
default.from_date=
label.to_date=To Date
default.to_date=
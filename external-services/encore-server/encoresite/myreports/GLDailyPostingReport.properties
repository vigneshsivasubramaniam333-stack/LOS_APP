
header=Transaction Date,BranchCode,GL Head, GL SubHead,GL Code,Product/AccountCode,Currency Code,Amount Debit,Amount Credit

query=select DATE_FORMAT(e.transaction_date , '%d-%m-%Y') as transaction_date,ap.branch_code as branch_code,gl.gl_head as gl_head, gl.gl_subhead as gl_subhead, \
   p.gl_code as gl_code, ap.product_code as product_code, ap.currency_code as currency, \
   greatest(sum(CASE when account_entry_type = 0 then amount_magnitude else -amount_magnitude end),0) as amount_credit, \
   greatest(sum(CASE when account_entry_type = 1 then amount_magnitude else -amount_magnitude end),0) as amount_debit \
from account_entries e, account_profiles ap, gl_subheads gl, products p, branchset_branches bsb \
where e.tenant_code = ap.tenant_code and e.account_id = ap.account_id and e.transaction_date >= :from_date and e.transaction_date <= :to_date \
and gl.tenant_code=ap.tenant_code and p.tenant_code = ap.tenant_code and  \
ap.product_type=p.product_type and ap.product_code=p.product_code and ap.currency_code = p.currency_code and p.gl_subhead = gl.gl_subhead and \
ap.tenant_code=:tenant_code and bsb.tenant_code = ap.tenant_code and bsb.branchset_code = :branchset_code_select and bsb.branch_code = ap.branch_code \
group by transaction_date,branch_code,ap.product_type,ap.product_code order by transaction_date,branch_code,gl_head,gl_subhead,gl_code

params=tenant_code,branchset_code_select,from_date,to_date
label.tenant_code=Tenant Code
default.tenant_code=
label.from_date=From Date
default.from_date=
label.to_date=To Date
default.to_date=
label.branchset_code_select=BranchSet
default.branchset_code_select=All

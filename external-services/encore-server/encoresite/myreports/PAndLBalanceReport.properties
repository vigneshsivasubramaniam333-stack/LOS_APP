header=GL Subhead,Account Code, Description, GL Code, Category, Branch Code,Balance:number, Currency

query=select ap.gl_subhead,ap.product_code,ps.product_description,ps.gl_code,ps.category,ap.branch_code,sum(ab.balance_magnitude) as balance,ap.currency_code \
from account_profiles ap,account_balances ab, products ps, branchset_branches bsb, internal_settings ins where \
ap.account_id = ab.account_id and ap.tenant_code = ab.tenant_code and ps.tenant_code=ap.tenant_code and \
ap.tenant_code = :tenant_code  and ab.balance_magnitude != 0 and ps.product_code=ap.product_code and \
ap.tenant_code = bsb.tenant_code and ap.branch_code = bsb.branch_code and bsb.branchset_code = :branchset_code_select and \
ap.currency_code = ps.currency_code and ap.product_type = ps.product_type and ap.product_type = 'Internal' and ps.category in ('Income', 'Expense') and \
ap.tenant_code = ins.tenant_code and ap.product_code != ins.profit_and_loss_account_code group by ap.gl_subhead,ap.product_type,ap.product_code,ap.branch_code,ap.currency_code,ap.tenant_code

params=tenant_code,branchset_code_select
label.tenant_code=Tenant Code
default.tenant_code=
label.branchset_code_select=BranchSet
default.branchset_code_select=All
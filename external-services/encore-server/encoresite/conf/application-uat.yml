springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  paths-to-match: /webservices/**
server:
  port: 8090
  use-forward-headers: true
spring:
  datasource:
    url: "jdbc:mysql://10.0.1.5:3306/encoredb?zeroDateTimeBehavior=convertToNull"
    username: root
    password: mysql-Password
    hikari:
      autoCommit: false
      cachePrepStmts: true
      prepStmtCacheSize: 250
      prepStmtCacheSqlLimit: 2048
      useServerPrepStmts: true
      useLocalSessionState: true
      rewriteBatchedStatements: true
      cacheResultSetMetadata: true
      cacheServerConfiguration: true
      elideSetAutoCommits: true
      maintainTimeStats: false
      minimumIdle: 2
      maximumPoolSize: 10
  batch:
    job:
      enabled: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  task:
    execution:
      thread-name-prefix: encore-async-
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 500
  session:
    store-type: jdbc
    # https://docs.spring.io/spring-boot/docs/current/reference/html/spring-boot-features.html#boot-features-external-config-conversion-duration
    timeout: 60m
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION
      #schema: classpath:org/springframework/session/jdbc/schema-@@platform@@.sql # Path to the SQL file to use to initialize the database schema.
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: no-reply@sen-sei.in
    password: diwdpxiwgooedxcb
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  messages:
    basename: 'i18n/messages,i18n/application'
application:
  security:
    strategy: native      
  site:
    name: MG
    siteDir: '/home/encoresite/'
    controlServerUrl: "http://localhost:8080/encore"
    controlServerUserId: vuser
    controlServerPassword: vuser
    dashboardQueryName: main
    encoreUri: NA
    encoreUserId: NA
    encorePassword: NA
    storageProvider: local
  s3:
    accessKeyId: ${AWS_ACCESS_KEY_ID:CHANGE_ME}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY:CHANGE_ME}
    region: us-east-1
    bucketName: encore-cloud-test
    defaultExpiry: 3600000
  azureBlobStorage:
    connectString:
    containerName:
  access:
    modules: Base,Internal,Loans,CASA,Customer,Deposit
    scopes: read,write
  cors:
    allowed-origin-patterns:
      - 'https://core.dev.billionloans.com/encore/'
      - '*'
    max-age: 1800
  dbDump:
    sshHost: localhost
    sshPort: -1
    sshUser: root
    sshPassword: root
    dumpTimeout: 180
    dumpSecurityKey: "lkdnfklsdjnfkldsflkdfnjklgnsdfjkg"
    dumpScriptFile: "/opt/bin/mysql_dump.sh"
    accountDumpScriptFile: "/opt/bin/dumpAccount.sh"
  email:
    enableEmail: false
    defaultFromAddress: Encore <encore@sen-sei.in>
    defaultReplyAddress: noreply@sen-sei.in
  jasper:
    virtualizerMaxSize: 50
  batch:
    gridSize: 4
    skipLimit: 10
    commitInterval: 50
  transactBatch:
    gridSize: 4
    skipLimit: 100
    commitInterval: 5
  report:
    gridSize: 4
    commitInterval: 100
    dbInsertGridSize: 8
    dbInsertCommitInterval: 1
  digio:
    ach:
      corporateConfigId: PPPPPP
      clientId: QQQQQ
      clientSecret: RRRRRR
      url: "https://ext.digio.in:444"    
  superset:
    url: "http://44.212.114.135:8088"
    username: admin
    password: admin
  postalCode:
    baseUrl: https://api.worldpostallocations.com/pincode/
    defaultCountryCode: IN
  redmine:
    url: https://redmine4.senseitech.com/redmine
    key: cb6cb14742c7c9faf918a7b1bbad98894ea33fa5
    projectId: Encore-test
    statusId: open
    trackerId: Support
    priorityId: 1
    assignedToId: 2
    watcherUserIds:
      - 279

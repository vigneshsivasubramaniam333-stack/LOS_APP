header=Account Number,Customer Name,Branch Code,Lender Rate:number, Colender Rate:number, Maturity Date:date,Loan Start Date:date,Calculation Start Date:date,Payin Date:date,Demand Date:date, Receivables 100Pct:number,Principal 100Pct:number,Interest 100Pct:number,Balance 100Pct:number, Receivables 80Pct:number, Principal 80Pct:number, Interest 80Pct:number, Balance 80Pct:number, Receivables 20Pct:number, Principal 20Pct:number, Interest 20Pct:number, Balance 20Pct:number

query=Select p.account_id as string_value from account_profiles p, loan_od_profiles lp, loan_od_working_registers w, branchset_branches bsb where p.tenant_code = :tenant_code and bsb.branchset_code = :branchset_code_select \
and p.tenant_code = w.tenant_code and p.account_id = w.account_id and p.product_type = 'Loans' and p.operational_status <> 3 and \
p.account_id = lp.account_id and p.tenant_code = lp.tenant_code and lp.colending_applicable = 1 and bsb.branch_code = p.branch_code and bsb.tenant_code = p.tenant_code and \
( ( p.opened_on_value_date >= :from_date and p.opened_on_value_date <= :to_date) or (p.opened_on_value_date < :from_date and ( p.closed_on_value_date is null or p.closed_on_value_date >= :from_date ) ) )

params=tenant_code,branchset_code_select,from_date,to_date
label.tenant_code=Tenant Code
default.tenant_code=
label.branchset_code_select=Branchset
default.branchset_code_select=All
label.from_date=From Date
default.from_date=
label.to_date=To Date
default.to_date=

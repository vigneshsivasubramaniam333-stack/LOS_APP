header=Value Date, AccountId,Product Type, Product Code,Product Description, GL Subhead, GL Code, Branch Code,Currency Code,Balance

query=select :from_date,ap.account_id, ap.product_type, ap.product_code, pr.product_description, pr.gl_subhead, pr.gl_code, ap.branch_code, ap.currency_code, \
   sum(CASE when account_entry_type = 0 then amount_magnitude else -amount_magnitude end) as balance \
from account_entries e, account_profiles ap, products pr, branchset_branches bsb \
where e.tenant_code = ap.tenant_code and e.account_id = ap.account_id and e.value_date <= :from_date and \
ap.tenant_code = pr.tenant_code and ap.product_type = pr.product_type and ap.product_code = pr.product_code and ap.currency_code = pr.currency_code and \
ap.tenant_code = bsb.tenant_code and ap.branch_code = bsb.branch_code and bsb.branchset_code = :branchset_code_select and e.tenant_code = :tenant_code \
group by ap.tenant_code, ap.account_id

params=tenant_code,branchset_code_select,from_date
label.tenant_code=Tenant Code
default.tenant_code=
label.branchset_code_select=Branchset
default.branchset_code_select=All
label.from_date=From Date
default.from_date=

main.resultType=composite
main.query=loanAmount,disbursementsAmount,collectionsAmount,interestBookedAmount,feeChargedAmount,feePaidAmount,\
ledgerBalanceAmount,loanCount,disbursementsCount,collectionsCount,writeOffsCount,writeOffsBranchesCount,interestBookedCount,\
activeLoansCount,activeClientsCount,loanBucket

loanAmount.resultType=single
loanAmount.header=loanAmount
loanAmount.query=select SUM(lp.amount_magnitude) from loan_od_profiles lp,account_profiles ap,banks b where ap.tenant_code= :tenantCode and ap.tenant_code=lp.tenant_code and ap.tenant_code=b.tenant_code and ap.account_id=lp.account_id and ap.operational_status=0 and ap.product_type='Loans' and ap.opened_on_value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ap.opened_on_value_date<=b.current_working_date
loanAmount.input=

disbursementsAmount.resultType=single
disbursementsAmount.header=disbursementsAmount
disbursementsAmount.query=select SUM(ld.amount_magnitude) from loan_od_disbursements ld,account_profiles ap,banks b where ap.tenant_code= :tenantCode and ap.tenant_code=ld.tenant_code and ap.tenant_code=b.tenant_code and ap.account_id=ld.account_id and ap.operational_status=0 and ap.product_type='Loans' and ld.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ld.value_date<=b.current_working_date
disbursementsAmount.input=

collectionsAmount.resultType=single
collectionsAmount.header=collectionsAmount
collectionsAmount.query=select SUM(lr.amount_magnitude) from loan_od_repayments lr,banks b where lr.tenant_code= :tenantCode and lr.tenant_code=b.tenant_code and lr.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and lr.value_date<=b.current_working_date
collectionsAmount.input=

interestBookedAmount.resultType=single
interestBookedAmount.header=interestBookedAmount
interestBookedAmount.query= select sum(ic.interest_magnitude) FROM interest_computations ic ,account_profiles ap, branchset_branches bs, banks b where ic.tenant_code=ap.tenant_code and ic.tenant_code=bs.tenant_code and ic.account_id=ap.account_id and ap.branch_code=bs.branch_code and bs.branchset_code ='All' and ic.tenant_code='NBFC1' and ic.tenant_code=b.tenant_code and ic.interest_type=0 and ic.computation_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ic.computation_date<=b.current_working_date
interestBookedAmount.input=

feeChargedAmount.resultType=single
feeChargedAmount.header=feeChargedAmount
feeChargedAmount.query=select SUM(f.gross_amount_magnitude) from fees f,banks b where f.tenant_code= :tenantCode and f.tenant_code=b.tenant_code and f.charged_value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and f.charged_value_date<=b.current_working_date
feeChargedAmount.input=

feePaidAmount.resultType=single
feePaidAmount.header=feePaidAmount
feePaidAmount.query=select SUM(fp.paid_amount_magnitude) from fee_payments fp,banks b where fp.tenant_code= :tenantCode and fp.tenant_code=b.tenant_code and fp.payment_value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and fp.payment_value_date<=b.current_working_date
feePaidAmount.input=

ledgerBalanceAmount.resultType=single
ledgerBalanceAmount.header=ledgerBalanceAmount
ledgerBalanceAmount.query=select sum(abs(ab.balance_magnitude )) from account_balances ab, account_profiles ap, banks b , loan_od_disbursements ld where ab.account_id=ap.account_id and ab.tenant_code=ap.tenant_code  and ap.product_type='Loans' and ap.operational_status=0 and ap.tenant_code=b.tenant_code and ap.account_id=ld.account_id and ld.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ld.value_date<=b.current_working_date
ledgerBalanceAmount.input=

loanCount.resultType=single
loanCount.header=loanCount
loanCount.query=select count(*) from account_profiles ap,banks b where ap.tenant_code= :tenantCode and ap.tenant_code=b.tenant_code and ap.operational_status=0 and ap.product_type='Loans' and ap.opened_on_value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ap.opened_on_value_date<=b.current_working_date
loanCount.input=

disbursementsCount.resultType=single
disbursementsCount.header=disbursementsCount
disbursementsCount.query=select count(distinct(ld.account_id)) from loan_od_disbursements ld,account_profiles ap,banks b where ap.tenant_code= :tenantCode and ap.tenant_code=ld.tenant_code and ap.tenant_code=b.tenant_code and ap.account_id=ld.account_id and ap.operational_status=0 and ap.product_type='Loans' and ld.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ld.value_date<=b.current_working_date
disbursementsCount.input=

collectionsCount.resultType=single
collectionsCount.header=collectionsCount
collectionsCount.query=select count(distinct(lr.account_id)) from loan_od_repayments lr,banks b where lr.tenant_code= :tenantCode and lr.tenant_code=b.tenant_code and lr.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and lr.value_date<=b.current_working_date
collectionsCount.input=

writeOffsCount.resultType=single
writeOffsCount.header=writeOffsCount
writeOffsCount.query=select count(distinct(lw.account_id)) from loan_od_write_offs lw left join account_profiles ap on lw.account_id=ap.account_id and lw.tenant_code=ap.tenant_code and ap.product_type='Loans' ,banks b where lw.tenant_code=b.tenant_code and ap.operational_status=4 and lw.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and lw.value_date<=b.current_working_date
writeOffsCount.input=

writeOffsBranchesCount.resultType=single
writeOffsBranchesCount.header=writeOffsBranchesCount
writeOffsBranchesCount.query=select count(DISTINCT(ap.branch_code)) from account_profiles ap,loan_od_write_offs lw,banks b where lw.tenant_code= :tenantCode and lw.tenant_code=b.tenant_code and b.tenant_code=ap.tenant_code and ap.account_id=lw.account_id and  ap.operational_status=4 and  lw.value_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and lw.value_date<=b.current_working_date
writeOffsBranchesCount.input=

interestBookedCount.resultType=single
interestBookedCount.header=interestBookedCount
interestBookedCount.query=select count(distinct(ic.account_id)) FROM interest_computations ic ,account_profiles ap, branchset_branches bs, banks b where ic.tenant_code=ap.tenant_code and ic.tenant_code=bs.tenant_code and ic.account_id=ap.account_id and ap.branch_code=bs.branch_code and bs.branchset_code ='All' and ic.tenant_code='NBFC1' and ic.tenant_code=b.tenant_code and ic.computation_date>=DATE_ADD(DATE_SUB(DATE_SUB(b.current_working_date,INTERVAL 1 DAY),interval day(DATE_SUB(b.current_working_date,INTERVAL 1 DAY)) day), interval 1 day) and ic.computation_date<=b.current_working_date
interestBookedCount.input=

activeLoansCount.resultType=single
activeLoansCount.header=activeLoansCount
activeLoansCount.query=select count(*) from account_profiles where tenant_code= :tenantCode and operational_status=0 and product_type="Loans"
activeLoansCount.input=

activeClientsCount.resultType=single
activeClientsCount.header=activeClientsCount
activeClientsCount.query=select count(distinct(c.customer_id)) from customers c,account_holders ah,account_profiles ap where c.tenant_code= :tenantCode and c.tenant_code=ah.tenant_code and ah.tenant_code=ap.tenant_code and  c.customer_id=ah.customer_id and ah.holder_num=1 and ah.account_id=ap.account_id and ap.operational_status=0 and ap.product_type='Loans'
activeClientsCount.input=

disbursment.resultType=array
disbursment.header=valueDate,productCode,branchCode,value,count
disbursment.query=select ld.value_date,ap.product_code,ap.branch_code,sum(ld.amount_magnitude) as amount, count(amount_magnitude) as count from loan_od_disbursements ld,account_profiles ap where ld.account_id=ap.account_id and ld.tenant_code= :tenantCode and ld.tenant_code=ap.tenant_code and ld.value_date>= :fromDate and ld.value_date<= :toDate group by ld.value_date,ap.product_code,ap.branch_code
disbursment.input=fromDate,toDate

loan.resultType=array
loan.header=valueDate,productCode,branchCode,value,count
loan.query=select ap.opened_on_value_date,ap.product_code,ap.branch_code,SUM(lp.amount_magnitude),count(lp.amount_magnitude) from account_profiles ap,loan_od_profiles lp where ap.tenant_code= :tenantCode and ap.tenant_code=lp.tenant_code and ap.opened_on_value_date>= :fromDate and ap.opened_on_value_date<= :toDate and ap.account_id=lp.account_id group by ap.opened_on_value_date,ap.product_code,ap.branch_code
loan.input=fromDate,toDate

writeOff.resultType=array
writeOff.header=valueDate,productCode,branchCode,value,count
writeOff.query=select lw.value_date,ap.product_code,ap.branch_code,SUM(lw.amount_magnitude),count(lw.amount_magnitude) from account_profiles ap,loan_od_write_offs lw where lw.tenant_code= :tenantCode and lw.tenant_code=ap.tenant_code and lw.value_date>= :fromDate and lw.value_date<= :toDate and lw.account_id=ap.account_id group by lw.value_date,ap.product_code,ap.branch_code
writeOff.input=fromDate,toDate

collection.resultType=array
collection.header=valueDate,productCode,branchCode,amount,normalInterest,penalInterest,count
collection.query=select lr.value_date,ap.product_code,ap.branch_code,SUM(lr.amount_magnitude),SUM(lr.normal_interest_magnitude),SUM(lr.penal_interest_magnitude),count(lr.amount_magnitude) from loan_od_repayments lr,account_profiles ap where lr.tenant_code= :tenantCode and lr.tenant_code=ap.tenant_code and lr.value_date>= :fromDate and lr.value_date<= :toDate and lr.account_id=ap.account_id group by lr.value_date,ap.product_code,ap.branch_code
collection.input=fromDate,toDate

interestBooked.resultType=array
interestBooked.header=valueDate,productCode,branchCode,value,count
interestBooked.query=select ic.computation_date,ap.product_code,ap.branch_code,sum(interest_magnitude/tenure_days * (datediff(least(computation_date, :toDate), greatest(start_date, :fromDate)) + 1)) as interest,count(ic.interest_magnitude) \
from interest_computations ic, banks b where ic.tenant_code= :tenantCode and ic.tenant_code = b.tenant_code and ic.interest_type = 0 and \
( (:fromDate >= start_date and :fromDate <= computation_date) or \
(:toDate >= start_date and :toDate <= computation_date) or \
(:fromDate < start_date and :toDate > computation_date) )
interestBooked.input=fromDate,toDate

fees.resultType=array
fees.header=valueDate,feeChargedAmount,feeCatagory,feeCollectedAmount,productCode,branchCode,count
fees.query=select f.charged_value_date,SUM(f.gross_amount_magnitude) as feeCharged,f.fee_category,SUM(fp.paid_amount_magnitude) as feePaid,ap.product_code,ap.branch_code,count(f.gross_amount_magnitude) as count from fees f,fee_payments fp,account_profiles ap where f.tenant_code= :tenantCode and f.tenant_code=fp.tenant_code and f.tenant_code=ap.tenant_code and f.account_id=fp.account_id and fp.account_id=ap.account_id and f.fee_num=fp.fee_num and  f.charged_value_date>= :fromDate and f.charged_value_date<= :toDate group by f.charged_value_date,fp.fee_num,ap.product_code,ap.branch_code,f.fee_category
fees.input=fromDate,toDate

loanBucket.resultType=array
loanBucket.header=branchCode,productCode,maxBucketRange,count,dueAmount,principalDueAmount,normalInterestDueAmount,penalInterestDueAmount
loanBucket.query=select branch_code, product_code, bucket, count(dpd) as count, sum(due) as demand_due, sum(principal_due) as principal_due,sum(normal_interest_due) as normal_interest_due, sum(penal_interest_due) as penal_interest_due from (select p.branch_code as branch_code,p.product_code as product_code,d.demand_date, total_demand_due_magnitude as due,total_principal_due_magnitude as principal_due,total_normal_interest_due_magnitude as normal_interest_due,total_penal_interest_due_magnitude as penal_interest_due,case when w.oldest_due_demand_num = 0 then 0 else datediff(b.current_working_date,d.demand_date) end as dpd, case when w.oldest_due_demand_num = 0 then 30 when datediff(b.current_working_date, d.demand_date) < 31 then 30 when datediff(b.current_working_date, d.demand_date) < 61 then 60 when datediff(b.current_working_date, d.demand_date) < 91 then 90 when datediff(b.current_working_date, d.demand_date) < 121 then 120 when datediff(b.current_working_date, d.demand_date) < 151 then 150 else 180 end as bucket from banks b, account_profiles p, loan_od_working_registers w left join loan_od_demands d  on d.account_id = w.account_id and d.demand_num = w.oldest_due_demand_num and d.tenant_code= :tenantCode where b.tenant_code= :tenantCode and b.tenant_code= w.tenant_code and p.tenant_code = w.tenant_code and p.account_id = w.account_id) as pivot group by branch_code,product_code,bucket
loanBucket.input=

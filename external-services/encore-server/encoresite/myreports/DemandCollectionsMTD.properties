header=Ac num,CustomerId,Branch Code,Product Code,Demand Num,Type,Demand Date, Value Date, Transaction Date, Transaction Id, Transaction Name, Amount, Balance, Collected Principal, Collected Normal Interest, \
 Collected Penal Interest, Reference, Created At, Created By, Repayment Date, Repayment Amount, Repayment Type, Instrument, Account Code, User, Collection Efficiency,  Demand Principal, Demand Normal Interest, Demand Penal Interest, Repayment Principal, Repayment Normal Interest, Repayment Penal Interest

query=\
select account_id,customer_id,branch_code,product_code,demand_num,demand_type,demand_date,value_date,transaction_date,transaction_id,transaction_name,amount_magnitude,balance_magnitude,principal_magnitude,normal_interest_magnitude, \
penal_interest_magnitude,reference,created_at,created_by,repayment_date,repayment_magnitude,repayment_type,instrument,account_code,user_id, ROUND(repayment_magnitude/amount_magnitude,2) as collection_efficiency, demand_principal, demand_normal_interest, demand_penal_interest, repayment_principal, repayment_normal_interest, repayment_penal_interest  from ( \
\
select lf.tenant_code,lf.account_id, ah.customer_id, ap.branch_code, ap.product_code, lf.demand_num, lf.demand_type, lf.demand_date, lf.value_date, lf.transaction_date, lf.transaction_id, \
lf.transaction_name, lf.amount_magnitude, lf.balance_magnitude, lf.principal_magnitude, lf.normal_interest_magnitude, lf.penal_interest_magnitude, lf.reference, lf.created_at, lf.created_by, \
lr.value_date AS repayment_date, lr.amount_magnitude AS repayment_magnitude ,lr.repayment_type AS repayment_type, lr.instrument, lr.account_code, lr.user_id, ld.principal_magnitude as demand_principal, ld.normal_interest_magnitude as demand_normal_interest, ld.penal_interest_magnitude as demand_penal_interest, \
lr.principal_magnitude as repayment_principal, lr.normal_interest_magnitude as repayment_normal_interest, lr.penal_interest_magnitude as repayment_penal_interest \
from loan_od_fulfillments lf left join loan_od_demands ld on lf.account_id = ld.account_id and lf.tenant_code = ld.tenant_code and lf.demand_num = ld.demand_num, loan_od_repayments lr, account_holders ah, account_profiles ap, branchset_branches bs \
where lf.transaction_id=lr.transaction_id and lf.tenant_code=lr.tenant_code and ap.branch_code=bs.branch_code and ap.tenant_code=bs.tenant_code \
and lf.account_id=ah.account_id and lf.tenant_code=ah.tenant_code and ah.holder_num=1 \
and lf.account_id=ap.account_id and lf.tenant_code=ap.tenant_code and bs.branchset_code = :branchset_code_select and \
(ld.transaction_date>=DATE_ADD(DATE_SUB(DATE_SUB(:to_date,INTERVAL 1 DAY),interval day(DATE_SUB(:to_date,INTERVAL 1 DAY)) day), interval 1 day) and ld.transaction_date<=DATE_SUB(:to_date,INTERVAL 1 DAY)) \
\
UNION ALL \
\
select lf.tenant_code, lf.account_id, ah.customer_id, ap.branch_code, ap.product_code, lf.demand_num, lf.demand_type, lf.demand_date, lf.value_date, lf.transaction_date, lf.transaction_id, \
lf.transaction_name, lf.amount_magnitude , lf.balance_magnitude, lf.principal_magnitude, lf.normal_interest_magnitude, lf.penal_interest_magnitude, lf.reference, lf.created_at, lf.created_by, \
lw.value_date AS repayment_date, lw.amount_magnitude AS repayment_magnitude, lw.write_off_transaction_type AS repayment_type, lw.instrument, lw.account_code, lw.user_id, ld.principal_magnitude as demand_principal, ld.normal_interest_magnitude as demand_normal_interest, ld.penal_interest_magnitude as demand_penal_interest, \
lw.principal_magnitude as repayment_principal, lw.normal_interest_magnitude as repayment_normal_interest, lw.penal_interest_magnitude as repayment_penal_interest \
from loan_od_fulfillments lf left join loan_od_demands ld on lf.account_id = ld.account_id and lf.tenant_code = ld.tenant_code and lf.demand_num = ld.demand_num, loan_od_write_offs lw, account_holders ah, account_profiles ap, branchset_branches bs  \
where lf.transaction_id=lw.transaction_id and lf.tenant_code=lw.tenant_code and ap.branch_code=bs.branch_code and ap.tenant_code=bs.tenant_code \
and lf.account_id=ah.account_id and lf.tenant_code=ah.tenant_code and ah.holder_num=1 \
and lf.account_id=ap.account_id and lf.tenant_code=ap.tenant_code and bs.branchset_code = :branchset_code_select and \
(ld.transaction_date>=DATE_ADD(DATE_SUB(DATE_SUB(:to_date,INTERVAL 1 DAY),interval day(DATE_SUB(:to_date,INTERVAL 1 DAY)) day), interval 1 day) and ld.transaction_date<=DATE_SUB(:to_date,INTERVAL 1 DAY)) \
\
) t where amount_magnitude > 0 order by tenant_code,account_id,demand_num

params=tenant_code,branchset_code_select,to_date
label.tenant_code=Tenant Code
default.tenant_code=
label.branchset_code_select=Branchset
default.branchset_code_select=All
label.to_date=To Date
default.to_date=

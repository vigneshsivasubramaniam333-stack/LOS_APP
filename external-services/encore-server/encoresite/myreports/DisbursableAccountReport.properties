header=Account Number,URN No,Branch Code,Product Code,Value Date,Transaction Date,Pending Days,Status,Loan Amount,Customer Name,Created At,Interest Rate,Branch Name,Vertical,Guarantor Name

query=SELECT ap.account_id as 'Account Number',ah.customer_id as 'URN No',ap.branch_code as 'Branch Code',ap.product_code as 'Product Code',ap.opened_on_value_date as 'Open Date',ap.opened_on_transaction_date as 'Transaction Date', \
datediff(bk.current_working_date, ap.opened_on_value_date), ap.operational_status,lp.amount_magnitude as 'Loan Amount',concat(ah.first_name," ",ah.middle_name," ",ah.last_name) as 'Customer Name',\
ap.created_at as 'Created At',(lp.normal_interest_rate*100) as 'Interest Rate',b.branch_name as 'Branch Name',c.sector as 'Vertical',\
concat(COALESCE(cs.first_name,''),' ',COALESCE(cs.middle_name,''),' ',COALESCE(cs.last_name)) as 'Guarantor Name' \
FROM account_profiles ap ,customers c, account_holders ah, loan_od_working_registers w,\
branchset_branches bs,branches b,banks bk, loan_od_profiles lp left join customers cs on (lp.tenant_code=cs.tenant_code and lp.guarantor_customer_id1=cs.customer_id)\
where lp.tenant_code=ap.tenant_code and bs.tenant_code=b.tenant_code and w.account_id = ap.account_id and w.tenant_code = ap.tenant_code and \
ap.tenant_code=ah.tenant_code and c.tenant_code=ah.tenant_code and w.num_disbursements = 0 and ap.tenant_code = bk.tenant_code and \
ah.tenant_code=bs.tenant_code and ap.account_id=ah.account_id and ap.account_id=lp.account_id and ah.holder_num=1 and c.customer_id=ah.customer_id and bs.branch_code=b.branch_code and \
ap.branch_code=bs.branch_code and ap.tenant_code=:tenant_code and bs.branchset_code =:branchset_code_select and (ap.opened_on_transaction_date>=:from_date and ap.opened_on_transaction_date<=:to_date)

params=tenant_code,from_date,to_date,branchset_code_select
label.tenant_code=Tenant Code
default.tenant_code=
label.from_date=From Date
default.from_date=
label.to_date=To Date
default.to_date=
label.branchset_code_select=BranchSet
default.branchset_code_select=

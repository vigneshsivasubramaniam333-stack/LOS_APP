disbursem3.query=select bc.state_code,u.phone1,c.relationship_manager_email_id,c.first_name,s.net_disbursement_magnitude,p.account_id,\
date_format(w.next_demand_run_date, '%d/%m/%Y'),date_format(s.transaction_date, '%d/%m/%Y'),s.sequence_num, -b.balance_magnitude,s.transaction_id,substring_index(reference, '|', 1) \
from account_profiles p, account_holders h, loan_od_profiles l, loan_od_working_registers w, loan_od_disbursements s, customers c,branches bc, users u, account_balances b \
where h.tenant_code = :tenantCode and h.tenant_code = bc.tenant_code and h.tenant_code = p.tenant_code and p.tenant_code = b.tenant_code and h.account_id = p.account_id \
and p.account_id = b.account_id and l.tenant_code = h.tenant_code and l.account_id = h.account_id and w.tenant_code = h.tenant_code and w.account_id = h.account_id and \
s.tenant_code = h.tenant_code and s.account_id = h.account_id and p.tenant_code=u.tenant_code and c.tenant_code = p.tenant_code and \
c.customer_id = h.customer_id and p.branch_code=bc.branch_code and p.open_user_id=u.userid and h.account_id = :accountId and s.sequence_num = :sequenceNum and reference regexp 'UTR:'
disbursem3.message.English=Disbursement amount of INR {4} for account {5} of customer {3} has been credited: {11}


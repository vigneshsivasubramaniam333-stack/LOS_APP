query=select ap.branch_code, h.first_name as firstName, case when c.customer_type='3' then '11' when c.customer_type='2' then '12' when c.customer_type='Business Entities Created by Statute' then '20' when c.customer_type='Proprietorship' then '30'  \
			 when c.customer_type='4' then '40' when c.customer_type='6' then '50' when c.customer_type='8' then '55' when c.customer_type='5' then '60' when c.customer_type='10' then '70' when c.customer_type='7'  \
			 then '80' when c.customer_type='12' then '85' else '99' end as borrowersLegalConstitution,  \
			 case when c.segment='MSME' then '01' when c.segment='SME' then '02' when c.segment='Micro' then '03' when c.segment='Small' then '04' when c.segment='Medium' then '05' when c.segment='Large' then '06' else '07' end as businessCategory, \
			 case when l.udf_text16='Manufacturing' then '01' when l.udf_text16='Distribution' then '02' when l.udf_text16='Wholesale' then '03' when l.udf_text16='Trading' then '04'  \
			 when l.udf_text16='Broking' then '05' when l.udf_text16='Service Provider' then '06' when l.udf_text16='Importing' then '07' when l.udf_text16='Exporting' then '08'  \
			 when l.udf_text16='Agriculture' then '09' when l.udf_text16='Dealers' then '10' else '11' end as businessType,'01' as locationType, COALESCE(c.address1,'') as address, case when c.customer_type='0' then '2' when c.customer_type='12' then '2'  \
			 else '1' end as relatedType, '60' as relationShip,l.account_id,w.total_disbursed_magnitude,ap.currency_code,case when l.tenure_unit=4 then '01' when l.tenure_unit=5 then '02' else '08' end as frequency, \
			 ab.balance_magnitude, w.asset_category,w.total_demand_due_magnitude,ap.operational_status, \
			 case when cs.customer_type='0' then '2' else '1' end as guarantorLegalConstitution, cs.salutation as gSalutation,cs.first_name as guarantorName, cs.gender as gGender,DATE_FORMAT(cs.date_of_birth,'%d%m%Y') as gDateOfBirth,  \
			 cs.pan as gPan,cs.uid_num as gUid, cs.address1 as gAddress1,cs.address2 as gAddress2,cs.address3 as gAddress3,  \
			 cs.city_code as gCity, cs.district_code as gDistrict, cs.state_code as gState,cs.pin_code as gPin,cs.country_code as gCountry,case when c.segment='MSME' then '01' when c.segment='SME' then '02' when c.segment='Micro'  \
			 then '03' when c.segment='Small' then '04' when c.segment='Medium' then '05' when c.segment='Large' then '06' else '07' end as guarantorBusinessCategory,case when l.udf_text16='Manufacturing' then '01' when l.udf_text16='Distribution' then  \
			 '02' when l.udf_text16='Wholesale' then '03' when l.udf_text16='Trading' then '04' when l.udf_text16='Broking' then '05' when l.udf_text16='Service Provider' then '06' when l.udf_text16='Importing' then '07'  \
			 when l.udf_text16='Exporting' then '08' when l.udf_text16='Agriculture' then '09' when l.udf_text16='Dealers' then '10' else '11' end as guarantorbusinessType,  \
			 DATE_FORMAT(l.udf_text16,'%d%m%Y') as dateOfIncorporation, l.udf_text17 as valueOfSecurity, c.state_code, c.pin_code,DATE_FORMAT(w.last_provisioning_date,'%d%m%Y'),c.account_holder_name3 as managerialPerson, c.country_code, cs.customer_id,  \
			 h.middle_name as middleName, h.last_name as lastName, cs.middle_name as gMiddleName, cs.last_name as gLastName, w.total_principal_repaid_magnitude as principalRepaid,c.pan, \
			 COALESCE(c.address2,'') as address2,COALESCE(c.address3,'') as address3,COALESCE(c.city_code,'') as cityCode,COALESCE(c.district_code,'') as districtCode,c.phone1,c.phone2,cs.phone1 as gPhone1,cs.phone2 as gPhone2,DATE_FORMAT(ap.closed_on_value_date,'%d%m%Y'), \
			 case when w.oldest_due_demand_num = 0 then 0 else datediff(bk.current_working_date, d.demand_date) end as dpd,  \
			 cs.cin as gcin, cs.document_number1 as gDocumentNo1, cs.document_number2 as gDocumentNo2, cs.document_number3 as gDocumentNo3, DATE_FORMAT(w.first_disbursement_date,'%d%m%Y'),  \
			 case when lp.repayment_method=1 then '0300' when lp.repayment_method=2 then '0200' when ((l.tenure_unit=1 and l.tenure_days<365) or (l.tenure_unit=2 and ROUND(l.tenure_days/7)<52) or (l.tenure_unit=3 and ROUND(l.tenure_days/14)<26) or (l.tenure_unit=4 and l.tenure_months<12) or  \
			 (l.tenure_unit=5 and ROUND(l.tenure_months/3)<4) or (l.tenure_unit=6 and ROUND(l.tenure_months/6)<2) or (l.tenure_unit=7 and ROUND(l.tenure_months/12)<1)) then '5100'  \
			 when ((l.tenure_unit=1 and (l.tenure_days>=365 and l.tenure_days<=1095)) or (l.tenure_unit=2 and (ROUND(l.tenure_days/7)>=52 and ROUND(l.tenure_days/7)<=156)) or (l.tenure_unit=3 and (ROUND(l.tenure_days/14)>=26 and ROUND(l.tenure_days/14)<=78)) or  \
			 (l.tenure_unit=4 and (l.tenure_months>=12 and l.tenure_months<=36)) or (l.tenure_unit=5 and (ROUND(l.tenure_months/3)>=4 and ROUND(l.tenure_months/3)<=12)) or (l.tenure_unit=6 and (ROUND(l.tenure_months/6)>=2 and ROUND(l.tenure_months/6)<=6)) or  \
			 (l.tenure_unit=7 and (ROUND(l.tenure_months/12)>=1 and ROUND(l.tenure_months/12)<=3))) then '0410' when ((l.tenure_unit=1 and l.tenure_days>1095) or (l.tenure_unit=2 and ROUND(l.tenure_days/7)>156) or  \
			 (l.tenure_unit=3 and ROUND(l.tenure_days/14)>78) or (l.tenure_unit=4 and l.tenure_months>36) or (l.tenure_unit=5 and ROUND(l.tenure_months/3)>12) or (l.tenure_unit=6 and ROUND(l.tenure_months/6)>6) or  \
			 (l.tenure_unit=7 and ROUND(l.tenure_months/12)>3)) then '0420' else '5000' end as creditType, c.salutation, c.gender, DATE_FORMAT(c.date_of_birth,'%d%m%Y'), c.document_number1 as documentNo1, c.document_number2 as documentNo2, c.document_number3 as documentNo3, c.uid_num  \
			 from customers c, account_holders h, loan_od_profiles l left join loan_od_associates la on (l.tenant_code=la.tenant_code and l.account_id=la.account_id and la.associate_type=1)  \
			 left join customers cs on (la.tenant_code=cs.tenant_code and la.associate_id=cs.customer_id),  \
			 loan_od_working_registers w left join loan_od_demands d on ( w.tenant_code = d.tenant_code and w.account_id = d.account_id and w.oldest_due_demand_num = d.demand_num),  \
			  account_balances ab, account_profiles ap, banks bk, loan_od_products lp  \
			 where c.tenant_code=bk.tenant_code and c.tenant_code=h.tenant_code and h.tenant_code=l.tenant_code and l.tenant_code=w.tenant_code and l.tenant_code=ap.tenant_code and l.tenant_code=ab.tenant_code and  \
			 ap.tenant_code=lp.tenant_code and ap.product_code=lp.product_code and ap.product_type=lp.product_type and ap.currency_code=lp.currency_code and  \
			 l.account_id=ab.account_id and l.account_id=ap.account_id and c.customer_id=h.customer_id and h.account_id=l.account_id and l.account_id=w.account_id and  \
			 ap.operational_status!=1 and l.udf_text18 like 'Commercial%' and c.tenant_code= :tenant_code

params=tenant_code
label.tenant_code=Tenant Code
default.tenant_code=


			
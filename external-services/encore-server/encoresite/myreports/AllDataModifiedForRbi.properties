header=Ac No,Disb date,Disb Amt,Maturity date,Principal Repaid,Interest Repaid,DPD,Effective DPD,Total Fee Due ,Penal Interest Due,Late charge,Ledger Balance,Adjusted balance,Principal Due,Normal Interest Due,\
Ac status,Ac closed date,Last payment date,BookedNotDueNormalInterest,Num Demands, Num Satisfied Demands ,Tag,URN,First Repayment Date,Interest Rate,Installment,Tenure,Frequency,NextDemandScheduledDate,Net Payoff Amt,\
PrincipalNotDue,Interest TDS,Scheduled Payment,AccountName,ProductType,ProductCode,BranchCode,BranchName,PenalInterestRate,GlSubhead,OpenedOnValueDate,NextDemandRunDate,LastDemandRunDate,LastBookingDate,\

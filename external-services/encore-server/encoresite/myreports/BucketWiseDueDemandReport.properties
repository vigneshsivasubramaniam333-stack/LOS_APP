header=AccountId,Demand Date,Demand Num,Principal,Normal Interest,Penal Interest,Demand Amount,Total Demand Due,Demand Due,Principal Due,NormalInterest Due,Penal Interest Due,OD Days,Customer Name,Guarantor Name,Vertical,Ledger Balance,Effective DPD

query=select t.account_id,t.demand_date,t.demand_num,t.principal,t.normal_interest,t.penal_interest,t.demand_amount,t.total_demand_due,\
                t.demand_due,t.principal_due,t.normal_interest_due,t.penal_interest_due, t.OD_Days,\
                concat(COALESCE(h.first_name,''),(case when COALESCE(h.middle_name,'')='' then '' else (concat(' ',COALESCE(h.middle_name,''))) end),' ',COALESCE(h.last_name,'')) as customerName,\
                concat(COALESCE(la.first_name,''),(case when COALESCE(la.middle_name,'')='' then '' else (concat(' ',COALESCE(la.middle_name,''))) end),' ',COALESCE(la.last_name,'')) as guarantorName,\
                c.sector, -ab.balance_magnitude as ledgerBalance, t.effective_dpd \
from (select account_id, demand_num, demand_date, principal_magnitude as principal, normal_interest_magnitude as normal_interest, penal_interest_magnitude as penal_interest, \
                   amount_magnitude as demand_amount, total_demand_due_magnitude as total_demand_due, demand_due, \
                   least(demand_due-least(demand_due, penal_interest_magnitude), principal_magnitude) as principal_due, \
                   least(demand_due-least(demand_due-least(demand_due, penal_interest_magnitude), principal_magnitude)-least(demand_due, penal_interest_magnitude), normal_interest_magnitude) as normal_interest_due, \
                   least(demand_due, penal_interest_magnitude) as penal_interest_due, \
                   DATEDIFF(b.current_working_date, demand_date) as 'OD_Days',case when effective_date is null then datediff(b.current_working_date, demand_date) \
                   when  datediff(demand_date, effective_date) > 0 then datediff(b.current_working_date, demand_date) \
                   else datediff(b.current_working_date, demand_date) - least(datediff(b.current_working_date, effective_date), (datediff( expiry_date, effective_date)+1)) \
                   end as effective_dpd, d.tenant_code \
                from (select d1.tenant_code as tenant_code, d1.account_id as account_id, d1.demand_num as demand_num, d1.demand_date as demand_date, ht.effective_date, ht.expiry_date, \
                                 d1.amount_magnitude as amount_magnitude, d1.principal_magnitude as principal_magnitude, \
                                 d1.normal_interest_magnitude as normal_interest_magnitude, d1.penal_interest_magnitude as penal_interest_magnitude, w.total_demand_due_magnitude, \
                                 greatest(0, least(d1.amount_magnitude, w.total_demand_due_magnitude+d1.amount_magnitude-( \
                                         select sum(d2.amount_magnitude) from loan_od_demands d2 where d2.account_id = d1.account_id and d2.tenant_code = d1.tenant_code and d2.id >= d1.id) \
                                 )) as demand_due \
                          from loan_od_demands d1, loan_od_working_registers w left join loan_od_tags lt on (w.tenant_code = lt.tenant_code and w.account_id = lt.account_id) left join loan_od_history_tags ht on \
            (w.tenant_code=ht.tenant_code and w.account_id=ht.account_id and ht.classifier='Moratorium') \
                          where w.tenant_code = d1.tenant_code and w.account_id = d1.account_id and w.total_demand_due_magnitude > 0 and w.tenant_code = :tenant_code ) d, banks b \
                where d.demand_due > 0 and d.tenant_code = b.tenant_code) t, customers c,account_holders h, \
                loan_od_profiles l left join loan_od_associates la on la.tenant_code=l.tenant_code and la.account_id=l.account_id and la.associate_type=1 and la.sequence_num=1 left join customers cs on ( la.tenant_code = cs.tenant_code and la.associate_id = cs.customer_id), account_balances ab \
where t.tenant_code=c.tenant_code and c.tenant_code=h.tenant_code and h.tenant_code=l.tenant_code and l.tenant_code=ab.tenant_code and l.tenant_code = :tenant_code \
                and c.customer_id=h.customer_id and h.holder_num=1 and h.account_id=l.account_id and l.account_id=ab.account_id and t.account_id=l.account_id order by t.account_id, t.demand_num


params=tenant_code
label.tenant_code=Tenant Code
default.tenant_code=

repaym5.message.English=Dear Customer, Your repayment amount INR {4} is due this month, please ensure to deposit the same before due date {6} to avoid penalty charges.
repaym5.query=select bc.state_code,c.phone1,c.email,c.first_name,w.installment_amount_magnitude+w.interest_adjustment_magnitude,p.account_id,\
date_format(w.next_demand_run_date, '%d/%m/%Y'),h.customer_id,p.product_code \
from account_profiles p, banks b, account_holders h, loan_od_profiles l, loan_od_working_registers w, customers c,branches bc \
where h.tenant_code = :tenantCode and h.tenant_code = b.tenant_code and h.tenant_code = p.tenant_code and h.account_id = p.account_id and \
l.tenant_code = h.tenant_code and l.account_id = h.account_id and w.tenant_code = h.tenant_code and w.account_id = h.account_id and h.customer_id = c.customer_id and \
h.tenant_code = bc.tenant_code and h.tenant_code = c.tenant_code and p.branch_code=bc.branch_code and w.installment_amount_magnitude is not null and \
date_add(b.current_working_date, INTERVAL 6 DAY) = w.next_demand_run_date and p.operational_status=0 and w.maturity_date>b.current_working_date
repaym5.scripts=InstallmentAmount.groovy

